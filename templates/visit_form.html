{% extends "base.html" %}{% block title %}Add visit | CareScope{% endblock %}{% block page_title %}Add visit{% endblock %}
{% block content %}<div class="page-intro"><div><h1>Record a visit</h1><p>Link an existing patient to an operational visit.</p></div><a class="btn secondary" href="{{ url_for('visits_page') }}">← Back to visits</a></div>
<form method="post" class="panel form-panel"><div class="form-grid"><label>Patient<select name="patient_id" required>{% for p in patients %}<option value="{{ p.patient_id }}" {% if patient_id==p.patient_id %}selected{% endif %}>#{{ p.patient_id }} — {{ p.patient_name }}</option>{% endfor %}</select>{% if not patients %}<small>Add a patient first.</small>{% endif %}</label><label>Department<select name="department" required>{% for d in departments %}<option>{{ d }}</option>{% endfor %}</select></label><label>Visit date<input type="date" name="visit_date" value="{{ today }}" required></label><label>Visit type<select name="visit_type">{% for t in visit_types %}<option>{{ t }}</option>{% endfor %}</select></label><label>Status<select name="status"><option>Registered</option><option>In Progress</option><option>Completed</option><option>Cancelled</option></select></label><label class="full">Notes (optional)<textarea name="notes" rows="3" placeholder="Operational note only; do not enter diagnoses or sensitive details."></textarea></label></div><div class="form-actions"><button class="btn primary" {% if not patients %}disabled{% endif %}>Save visit</button><a class="btn secondary" href="{{ url_for('visits_page') }}">Cancel</a></div></form>{% endblock %}

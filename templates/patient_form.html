{% extends "base.html" %}{% block title %}Add patient | CareScope{% endblock %}{% block page_title %}Add patient{% endblock %}
{% block content %}<div class="page-intro"><div><h1>Register a patient</h1><p>Use synthetic demo information only.</p></div><a class="btn secondary" href="{{ url_for('patients_page') }}">← Back to patients</a></div>
<form method="post" class="panel form-panel"><div class="form-grid"><label>Patient name<input name="patient_name" required maxlength="100" placeholder="e.g. Sample Patient"></label><label>Age<input type="number" name="age" required min="0" max="120" placeholder="Age in years"></label><label>Gender<select name="gender"><option>Not specified</option><option>Female</option><option>Male</option><option>Other</option></select></label></div><div class="form-actions"><button class="btn primary">Save and add visit</button><a class="btn secondary" href="{{ url_for('patients_page') }}">Cancel</a></div></form>{% endblock %}
